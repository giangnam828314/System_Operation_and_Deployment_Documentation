<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
<defs><style>.t{font:700 28px Arial;fill:#12304a}.s{font:15px Arial;fill:#426078}.h{font:700 17px Arial;fill:#12304a}.b{font:15px Arial;fill:#23445c}.lane{fill:#f7fbff;stroke:#9dbbd0;stroke-width:1.5}.line{stroke:#6a879b;stroke-width:2;stroke-dasharray:7 6}.msg{stroke:#1c729f;stroke-width:2.5;fill:none;marker-end:url(#a)}.ret{stroke:#b47a31;stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#b)}.note{fill:#fff4e8;stroke:#c47a26;stroke-width:1.5;rx:10}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="#1c729f"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="#b47a31"/></marker></defs>
<rect width="1440" height="1040" fill="#fff"/><text x="55" y="55" class="t">ĐẶT XE → ĐIỀU PHỐI → CHUYẾN ĐI — LUỒNG TUẦN TỰ</text><text x="55" y="84" class="s">Tương tác logic • thời gian đi từ trên xuống • chính sách/ngưỡng ngoại lệ chờ phê duyệt</text>
<g>
<rect x="50" y="120" width="190" height="72" class="lane"/><text x="145" y="150" text-anchor="middle" class="h">Khách hàng / Nhân viên</text><text x="145" y="175" text-anchor="middle" class="s">Kênh tiếp nhận</text>
<rect x="290" y="120" width="190" height="72" class="lane"/><text x="385" y="150" text-anchor="middle" class="h">Đặt xe Service</text>
<rect x="530" y="120" width="190" height="72" class="lane"/><text x="625" y="150" text-anchor="middle" class="h">Điều phối Engine</text>
<rect x="770" y="120" width="190" height="72" class="lane"/><text x="865" y="150" text-anchor="middle" class="h">Danh mục nguồn xe</text>
<rect x="1010" y="120" width="190" height="72" class="lane"/><text x="1105" y="150" text-anchor="middle" class="h">Ứng dụng tài xế</text>
<rect x="1250" y="120" width="150" height="72" class="lane"/><text x="1325" y="150" text-anchor="middle" class="h">Chuyến đi / Fare</text>

<g class="b">
<text x="260" y="225" text-anchor="middle">1. Tạo booking</text><text x="260" y="285" text-anchor="middle">2. Mã tra cứu + trạng thái</text><text x="505" y="345" text-anchor="middle">3. Yêu cầu điều phối</text><text x="745" y="405" text-anchor="middle">4. Tìm nguồn xe đủ điều kiện</text><text x="745" y="465" text-anchor="middle">5. Bản chụp ứng viên</text><text x="865" y="525" text-anchor="middle">6. Gửi lời mời</text><text x="865" y="585" text-anchor="middle">7. Chấp nhận / từ chối</text><text x="505" y="645" text-anchor="middle">8. Ghi nhận phân xe</text><text x="1215" y="705" text-anchor="middle">9. Chuyến đi milestones</text><text x="855" y="765" text-anchor="middle">10. Cước + kết quả chuyến</text><text x="265" y="825" text-anchor="middle">11. Cập nhật khách hàng</text>
</g>
<rect x="520" y="865" width="650" height="92" class="note"/><text x="545" y="895" class="h">Chấp nhận nguyên tử / kiểm soát đồng thời</text><text x="545" y="923" class="b">Kiểm tra hạn lời mời + phiên bản booking + điều kiện tài xế/xe;</text><text x="545" y="945" class="b">chỉ một yêu cầu thắng; lệnh trùng trả kết quả ban đầu nhờ khóa chống lặp.</text>
<rect x="55" y="980" width="1330" height="42" class="lane"/><text x="720" y="1007" text-anchor="middle" class="b">Sau khi hoàn tất: trạng thái thanh toán → ghi sổ cái → đối soát đối tác (nếu có) → kiểm tra và kiểm toán</text>
</svg>